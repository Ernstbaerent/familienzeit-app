# Miki, M9: KI-Wochenlauf. Erzeugt jeden Sonntag um 18 Uhr (Berliner Zeit) neue Aktivitäten mit der Claude API,
# prüft sie mit der Sicherheits-Checkliste und schreibt sie in die Supabase-Tabelle "activities".
# Anleitung, Kosten, Rückgängig machen und Pausen-Schalter: docs/wochenlauf.md
#
# Geplanter Lauf (sonntags): standardmäßig an. Pausieren mit der Repo-Variable WEEKLY_PAUSED=true.
#   Gibt automatisch frei, was alle Prüfungen ohne Auffälligkeit besteht. Ausschalten mit WEEKLY_AUTO_APPROVE=false (dann nur Entwürfe).
# Manueller Lauf (Actions → Wochenlauf Aktivitäten → Run workflow): dry_run (Standard: an) und auto_approve (Standard: aus).
#
# Secrets (Settings → Secrets and variables → Actions → Secrets): ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_SECRET_KEY.
# Variablen (… → Variables), alle freiwillig: WEEKLY_PAUSED, WEEKLY_AUTO_APPROVE, ANTHROPIC_MODEL (Standard claude-haiku-5-5),
#   MAX_ACTIVITIES (Standard 1500), MAX_COST_USD (Standard 0.5).

name: Wochenlauf Aktivitäten

on:
  schedule:
    # GitHub rechnet in UTC. 18 Uhr in Berlin ist im Sommer 16 Uhr UTC und im Winter 17 Uhr UTC.
    # Beide Zeiten sind eingetragen, der Schritt "Zeitplan und Pausen-Schalter prüfen" lässt nur die passende laufen.
    - cron: '0 16 * * 0' # Sonntag 18 Uhr Sommerzeit (MESZ, UTC+2)
    - cron: '0 17 * * 0' # Sonntag 18 Uhr Winterzeit (MEZ, UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Trockenlauf: nichts schreiben, nur anzeigen'
        type: boolean
        default: true
      auto_approve:
        description: 'Automatisch freigeben, was alle Prüfungen ohne Auffälligkeit besteht'
        type: boolean
        default: false

# Nur lesen: Der Lauf ändert nichts im Repo.
permissions:
  contents: read

# Nie zwei Läufe gleichzeitig. Ein zweiter wartet, bis der erste fertig ist.
concurrency:
  group: weekly-activities
  cancel-in-progress: false

jobs:
  generate:
    name: Aktivitäten erzeugen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Zeitplan und Pausen-Schalter prüfen
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PAUSED: ${{ vars.WEEKLY_PAUSED }}
          WEEKLY_AUTO_APPROVE: ${{ vars.WEEKLY_AUTO_APPROVE }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_AUTO_APPROVE: ${{ inputs.auto_approve }}
        run: |
          set -euo pipefail
          if [ "${EVENT:-}" = "workflow_dispatch" ]; then
            # Manueller Lauf: läuft auch, wenn der Wochenlauf pausiert ist.
            dry_run=false; [ "${INPUT_DRY_RUN:-}" = "true" ] && dry_run=true
            auto_approve=false; [ "${INPUT_AUTO_APPROVE:-}" = "true" ] && auto_approve=true
            { echo "run=true"; echo "dry_run=$dry_run"; echo "auto_approve=$auto_approve"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${PAUSED:-}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "**Wochenlauf pausiert** (Repo-Variable WEEKLY_PAUSED=true). Es wurde nichts erzeugt. Fortsetzen: Variable löschen oder auf false setzen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Welche der beiden Zeiten gilt gerade? Sommerzeit: +0200, Winterzeit: +0100.
          offset=$(TZ=Europe/Berlin date +%z)
          if { [ "${SCHEDULE:-}" = "0 16 * * 0" ] && [ "$offset" = "+0200" ]; } || { [ "${SCHEDULE:-}" = "0 17 * * 0" ] && [ "$offset" = "+0100" ]; }; then
            auto_approve=true; [ "${WEEKLY_AUTO_APPROVE:-}" = "false" ] && auto_approve=false
            { echo "run=true"; echo "dry_run=false"; echo "auto_approve=$auto_approve"; } >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nicht die Zeit für 18 Uhr in Berlin (Zeitplan ${SCHEDULE:-}, Berlin $offset). Der andere Zeitplan dieses Sonntags ist der richtige." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Code holen
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 22 einrichten
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Kein "npm ci": Das Skript braucht keine Pakete, nur Node. So laufen keine fremden Paketskripte neben den Schlüsseln.
      # Die Schlüssel stehen nur in diesem Schritt und nur als Umgebungsvariablen.
      - name: Wochenlauf
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAX_ACTIVITIES: ${{ vars.MAX_ACTIVITIES }}
          MAX_COST_USD: ${{ vars.MAX_COST_USD }}
          AUTO_APPROVE: ${{ steps.gate.outputs.auto_approve }}
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run -s activities:generate -- --dry-run
          else
            npm run -s activities:generate
          fi
